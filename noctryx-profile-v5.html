<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOCTRYX Profile</title><style>:root{--a:#38f58b}*{box-sizing:border-box}body{margin:0;background:#08090b;color:#f2f4f6;font:15px system-ui}.wrap{max-width:720px;margin:auto;padding:20px}.brand{font:900 24px monospace;letter-spacing:2px;margin:10px 0 24px}.brand span{color:var(--a)}.card{background:#101318;border:1px solid #293039;border-radius:16px;margin:14px 0;padding:20px}h1,h2{margin:0 0 8px}label{display:block;color:#bfc7ce;font-size:12px;font-weight:bold;margin:12px 0 6px}input,textarea,select{width:100%;background:#080a0d;color:#fff;border:1px solid #303943;border-radius:9px;padding:12px;font:inherit}textarea{min-height:80px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.avatars{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:8px}.av{aspect-ratio:1;border-radius:50%;background:#1a2025;color:white;border:1px solid #3b444d;font-size:22px}.av.sel{border:2px solid var(--a)}.preview{border:1px solid #26312a;border-radius:14px;padding:16px;margin-top:14px}.actions{display:flex;gap:10px;justify-content:flex-end;margin:16px 0}.btn{padding:11px 18px;border-radius:22px;border:1px solid #303943;background:#171c20;color:white;font-weight:bold}.primary{background:var(--a);color:#07130b;border-color:var(--a)}.note{color:#aab4bc;font-size:12px}.toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#171c20;border:1px solid var(--a);border-radius:12px;padding:12px}@media(max-width:560px){.grid{grid-template-columns:1fr}.avatars{grid-template-columns:repeat(6,1fr)}}
</style></head><body><main class="wrap"><div class="brand">NOCTR<span>YX</span></div><section class="card"><h1 data-t="title">Profile & settings</h1><p data-t="subtitle">Customize your NOCTRYX profile.</p><div class="preview"><div id="avPreview" style="font-size:32px">◈</div><h2 id="namePreview">NOCTRYX Member</h2><div id="userPreview" class="note">@member</div><p id="bioPreview"></p></div></section><section class="card"><h2 data-t="personal">Personal profile</h2><div class="grid"><div><label data-t="display">DISPLAY NAME</label><input id="name" value="NOCTRYX Member" maxlength="40"></div><div><label data-t="username">USERNAME</label><input id="username" value="member" maxlength="20"></div></div><label data-t="bio">BIO</label><textarea id="bio" maxlength="160"></textarea><label data-t="picture">PROFILE PICTURE</label><div id="avatars" class="avatars"></div></section><section class="card"><h2 data-t="langloc">Language & location</h2><div class="grid"><div><label data-t="language">LANGUAGE</label><select id="language"><option value="en">English</option><option value="yo">Yorùbá</option><option value="ha">Hausa</option><option value="ig">Igbo</option><option value="fr">Français</option><option value="es">Español</option><option value="pt">Português</option><option value="ar">العربية</option></select></div><div><label data-t="location">LOCATION</label><input id="location" placeholder="City, country (optional)"></div></div><label data-t="accent">PROFILE ACCENT</label><select id="theme"><option value="green">NOCTRYX Green</option><option value="red">Blood Red</option><option value="silver">Silver</option></select></section><p class="note" data-t="note">Prototype: saved in this browser only. Cloud accounts will be connected later.</p><div class="actions"><button class="btn" id="reset" data-t="reset">Reset</button><button class="btn primary" id="save" data-t="save">Save changes</button></div></main><div id="toast" class="toast"></div>
<script>
const tr={
en:{title:"Profile & settings",subtitle:"Customize your NOCTRYX profile.",personal:"Personal profile",display:"DISPLAY NAME",username:"USERNAME",bio:"BIO",picture:"PROFILE PICTURE",langloc:"Language & location",language:"LANGUAGE",location:"LOCATION",accent:"PROFILE ACCENT",note:"Prototype: saved in this browser only. Cloud accounts will be connected later.",reset:"Reset",save:"Save changes",placeholder:"Tell people about yourself",emptybio:"Add a bio to introduce yourself.",saved:"Profile saved on this device.",confirm:"Reset profile?"},
yo:{title:"Àkọọlẹ àti ètò",subtitle:"Ṣàtúnṣe àkọọlẹ NOCTRYX rẹ.",personal:"Àkọọlẹ ẹni",display:"ORÚKỌ ÌFÀHÀN",username:"ORÚKỌ OLÙLO",bio:"ÌTÀN KÚKÚRÚ",picture:"ÀWÒRÁN ÀÌDÁNIMỌ̀",langloc:"Èdè àti ibi",language:"ÈDÈ",location:"IBI",accent:"ÀWỌ̀N ÀWỌ̀N",note:"Àdánwò: a fi pamọ́ sínú ẹ̀rọ aṣàwákiri yìí nìkan.",reset:"Pààrọ̀ sí ìbẹ̀rẹ̀",save:"Fi àyípadà pamọ́",placeholder:"Sọ díẹ̀ nípa ara rẹ",emptybio:"Fi ìtàn kúkúrú sílẹ̀.",saved:"A fi àkọọlẹ pamọ́ sí ẹ̀rọ yìí.",confirm:"Ṣé o fẹ́ tún àkọọlẹ ṣe?"},
ha:{title:"Bayanin martaba da saituna",subtitle:"Keɓance bayanin NOCTRYX ɗinka.",personal:"Bayanin mutum",display:"SUNAN NUNI",username:"SUNAN MAI AMFANI",bio:"TAƘAITACCEN BAYANI",picture:"HOTON BAYANIN MARTABA",langloc:"Harshe da wuri",language:"HARSHE",location:"WURI",accent:"LAUNIN BAYANI",note:"Gwaji: an ajiye shi a wannan burauzar kawai.",reset:"Sake saita",save:"Ajiye canje-canje",placeholder:"Faɗi kaɗan game da kanka",emptybio:"Ƙara taƙaitaccen bayani.",saved:"An ajiye bayanin a wannan na'ura.",confirm:"Sake saita bayanin?"},
ig:{title:"Profaịlụ na ntọala",subtitle:"Hazie profaịlụ NOCTRYX gị.",personal:"Profaịlụ nkeonwe",display:"AHA NGOSI",username:"AHA ONYE ỌRỤ",bio:"NKỌWA",picture:"FOTO PROFAỊlụ",langloc:"Asụsụ na ebe",language:"ASỤSỤ",location:"Ebe",accent:"AGBA PROFAỊlụ",note:"Nnwale: a na-echekwa ya na ihe nchọgharị a naanị.",reset:"Tọgharịa",save:"Chekwa mgbanwe",placeholder:"Kọọ ntakịrị gbasara onwe gị",emptybio:"Tinye nkọwa dị mkpirikpi.",saved:"E chekwara profaịlụ na ngwaọrụ a.",confirm:"Tọgharịa profaịlụ?"},
fr:{title:"Profil et paramètres",subtitle:"Personnalisez votre profil NOCTRYX.",personal:"Profil personnel",display:"NOM AFFICHÉ",username:"NOM D’UTILISATEUR",bio:"BIO",picture:"PHOTO DE PROFIL",langloc:"Langue et lieu",language:"LANGUE",location:"LIEU",accent:"COULEUR DU PROFIL",note:"Prototype : enregistré dans ce navigateur uniquement.",reset:"Réinitialiser",save:"Enregistrer",placeholder:"Parlez un peu de vous",emptybio:"Ajoutez une bio.",saved:"Profil enregistré sur cet appareil.",confirm:"Réinitialiser le profil?"},
es:{title:"Perfil y ajustes",subtitle:"Personaliza tu perfil de NOCTRYX.",personal:"Perfil personal",display:"NOMBRE VISIBLE",username:"NOMBRE DE USUARIO",bio:"BIOGRAFÍA",picture:"FOTO DE PERFIL",langloc:"Idioma y ubicación",language:"IDIOMA",location:"UBICACIÓN",accent:"COLOR DEL PERFIL",note:"Prototipo: guardado solo en este navegador.",reset:"Restablecer",save:"Guardar cambios",placeholder:"Cuéntale a la gente sobre ti",emptybio:"Añade una biografía.",saved:"Perfil guardado en este dispositivo.",confirm:"¿Restablecer el perfil?"},
pt:{title:"Perfil e configurações",subtitle:"Personalize seu perfil NOCTRYX.",personal:"Perfil pessoal",display:"NOME DE EXIBIÇÃO",username:"NOME DE USUÁRIO",bio:"BIO",picture:"FOTO DO PERFIL",langloc:"Idioma e localização",language:"IDIOMA",location:"LOCALIZAÇÃO",accent:"COR DO PERFIL",note:"Protótipo: salvo apenas neste navegador.",reset:"Redefinir",save:"Salvar alterações",placeholder:"Conte um pouco sobre você",emptybio:"Adicione uma bio.",saved:"Perfil salvo neste dispositivo.",confirm:"Redefinir o perfil?"},
ar:{title:"الملف الشخصي والإعدادات",subtitle:"خصص ملفك الشخصي في NOCTRYX.",personal:"الملف الشخصي",display:"اسم العرض",username:"اسم المستخدم",bio:"نبذة",picture:"صورة الملف الشخصي",langloc:"اللغة والموقع",language:"اللغة",location:"الموقع",accent:"لون الملف الشخصي",note:"نسخة تجريبية: تُحفظ في هذا المتصفح فقط.",reset:"إعادة ضبط",save:"حفظ التغييرات",placeholder:"اكتب نبذة عن نفسك",emptybio:"أضف نبذة قصيرة.",saved:"تم حفظ الملف على هذا الجهاز.",confirm:"إعادة ضبط الملف؟"}
};const $=id=>document.getElementById(id);let chosen="◈";const icons=["◈","⌬","☾","⚡","♜","♠","☣","✦","⟁","◉","♟","☯","⌁","◆","⛧","✺"];
function applyLang(){const lang=$('language').value,t=tr[lang]||tr.en;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(el=>{const k=el.dataset.t;if(t[k])el.textContent=t[k]});$('bio').placeholder=t.placeholder;refresh()}
function refresh(){const t=tr[$('language').value]||tr.en;$('namePreview').textContent=$('name').value||'NOCTRYX Member';$('userPreview').textContent='@'+($('username').value.replace(/^@/,'')||'member');$('bioPreview').textContent=$('bio').value||t.emptybio;$('avPreview').textContent=chosen;document.documentElement.style.setProperty('--a',$('theme').value==='red'?'#ff4058':$('theme').value==='silver'?'#c2ccd5':'#38f58b')}
function draw(){const box=$('avatars');box.replaceChildren();icons.forEach(x=>{const b=document.createElement('button');b.className='av'+(x===chosen?' sel':'');b.type='button';b.textContent=x;b.onclick=()=>{chosen=x;draw();refresh()};box.appendChild(b)})}
$('language').onchange=applyLang;['name','username','bio','theme'].forEach(id=>$(id).addEventListener('input',refresh));$('save').onclick=()=>{localStorage.setItem('noctryx_profile_v5',JSON.stringify({name:$('name').value,username:$('username').value,bio:$('bio').value,location:$('location').value,language:$('language').value,theme:$('theme').value,avatar:chosen}));$('toast').textContent=(tr[$('language').value]||tr.en).saved;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)};$('reset').onclick=()=>{if(confirm((tr[$('language').value]||tr.en).confirm)){localStorage.removeItem('noctryx_profile_v5');location.reload()}};draw();applyLang();
</script></body></html>
