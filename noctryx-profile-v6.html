<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOCTRYX Profile</title>
<style>
:root{--a:#38f58b;--bg:#08090b;--panel:#101318;--line:#293039}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2f4f6;font:16px system-ui}main{max-width:720px;margin:auto;padding:20px}.brand{font:900 25px monospace;letter-spacing:2px;margin:10px 0 25px}.brand span{color:var(--a)}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:15px 0}h1{font-size:32px;margin:0 0 8px}h2{font-size:25px;margin:0 0 20px}.muted{color:#aab4bc}.preview{border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:20px}.avatar{width:86px;height:86px;border-radius:50%;border:2px solid var(--a);background:#171d22;color:white;display:grid;place-items:center;font-size:42px;overflow:hidden;cursor:zoom-in}.avatar img{width:100%;height:100%;object-fit:cover}.preview h3{font-size:26px;margin:14px 0 2px}.field{margin:16px 0}label{display:block;font-size:13px;font-weight:800;color:#bfc7ce;margin-bottom:7px}input,textarea,select{width:100%;background:#080a0d;color:#fff;border:1px solid #303943;border-radius:10px;padding:13px;font:inherit}textarea{min-height:90px;resize:vertical}.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.av{aspect-ratio:1;border-radius:50%;background:#1a2025;color:white;border:1px solid #3b444d;font-size:25px;cursor:pointer}.av.selected{border:2px solid var(--a);box-shadow:0 0 0 2px #38f58b33}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.buttons{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin:18px 0}.btn{padding:12px 18px;border-radius:24px;border:1px solid #303943;background:#171c20;color:white;font-weight:700;cursor:pointer}.primary{background:var(--a);color:#06140b;border-color:var(--a)}.note{font-size:12px;color:#aab4bc}.modal{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;padding:20px;z-index:9}.modal.open{display:flex}.modalbox{position:relative;max-width:min(90vw,520px);max-height:90vh;background:#101318;border:1px solid #3a424b;border-radius:18px;padding:16px;text-align:center}.modalbox img{display:block;max-width:80vw;max-height:75vh;border-radius:12px;object-fit:contain}.modalbox .symbol{font-size:min(50vw,220px);line-height:1.2}.close{position:absolute;right:10px;top:10px;background:#252b31;border:0;color:white;border-radius:50%;width:38px;height:38px;font-size:22px;cursor:pointer}.toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#171c20;border:1px solid var(--a);border-radius:12px;padding:12px;z-index:12}@media(max-width:560px){main{padding:14px}.row{grid-template-columns:1fr}.avatars{grid-template-columns:repeat(6,1fr)}h1{font-size:28px}}
</style></head><body><main>
<div class="brand">NOCTR<span>YX</span></div>
<section class="card"><h1>Profile & settings</h1><p class="muted">Customize your NOCTRYX profile.</p>
<div class="preview"><button id="previewAvatar" class="avatar" aria-label="View profile picture in full size">◈</button><h3 id="previewName">NOCTRYX Member</h3><div class="muted" id="previewUser">@member</div><p id="previewBio">Add a bio to introduce yourself.</p></div></section>
<section class="card"><h2>Personal profile</h2>
<div class="row"><div class="field"><label for="name">DISPLAY NAME</label><input id="name" maxlength="40" value="NOCTRYX Member"></div><div class="field"><label for="username">USERNAME</label><input id="username" maxlength="20" value="member"></div></div>
<div class="field"><label for="bio">BIO</label><textarea id="bio" maxlength="160" placeholder="Tell people about yourself"></textarea></div>
<div class="field"><label>PROFILE PICTURE — TAP A SYMBOL TO SELECT, TAP THE PREVIEW TO VIEW FULL SIZE</label><div id="avatars" class="avatars"></div></div>
<div class="field"><label for="upload">OR UPLOAD A PICTURE FROM YOUR PHONE</label><input id="upload" type="file" accept="image/*"></div></section>
<section class="card"><h2>Language & location</h2><div class="row"><div class="field"><label for="language">LANGUAGE</label><select id="language"><option value="en">English</option><option value="yo">Yorùbá</option><option value="ha">Hausa</option><option value="ig">Igbo</option><option value="fr">Français</option><option value="es">Español</option><option value="pt">Português</option><option value="ar">العربية</option></select></div><div class="field"><label for="location">LOCATION</label><input id="location" placeholder="City, country (optional)"></div></div><div class="field"><label for="theme">PROFILE ACCENT</label><select id="theme"><option value="green">NOCTRYX Green</option><option value="red">Blood Red</option><option value="silver">Silver</option></select></div></section>
<p class="note">Prototype: profile data is saved in this browser only. Cloud accounts will be connected later.</p><div class="buttons"><button class="btn" id="reset">Reset</button><button class="btn primary" id="save">Save changes</button></div>
</main><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Full size profile picture"><div class="modalbox"><button class="close" id="close" aria-label="Close">×</button><div id="fullPicture"></div><p class="muted">NOCTRYX profile picture</p></div></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id), symbols=["◈","⬡","☾","⚡","♜","♠","☣","✦","△","◎","♟","☯","⌁","◆","☆","✺"];
let avatar="◈",photo="",objectUrl="";
function pictureMarkup(full=false){if(photo)return `<img src="${photo}" alt="Profile picture">`;return `<span class="${full?'symbol':''}">${avatar}</span>`}
function render(){const name=$("name").value||"NOCTRYX Member",user=$("username").value.replace(/^@/,"")||"member";$("previewName").textContent=name;$("previewUser").textContent="@"+user;$("previewBio").textContent=$("bio").value||"Add a bio to introduce yourself.";$("previewAvatar").innerHTML=pictureMarkup();$("previewAvatar").style.cursor="zoom-in";document.documentElement.style.setProperty("--a",$("theme").value==="red"?"#ff4058":$("theme").value==="silver"?"#c2ccd5":"#38f58b")}
function draw(){const box=$("avatars");box.replaceChildren();symbols.forEach(s=>{const b=document.createElement("button");b.type="button";b.className="av"+(!photo&&s===avatar?" selected":"");b.textContent=s;b.setAttribute("aria-label","Choose avatar "+s);b.onclick=()=>{avatar=s;photo="";if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=""}$("upload").value="";draw();render()};box.appendChild(b)})}
function openModal(){$("fullPicture").innerHTML=pictureMarkup(true);$("modal").classList.add("open")}
function closeModal(){$("modal").classList.remove("open")}
$("previewAvatar").onclick=openModal;$("close").onclick=closeModal;$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
["name","username","bio","theme"].forEach(id=>$(id).addEventListener("input",render));
$("upload").addEventListener("change",e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith("image/"))return; if(file.size>5*1024*1024){alert("Please choose an image under 5 MB.");e.target.value="";return}if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(file);photo=objectUrl;draw();render()});
$("language").addEventListener("change",()=>{const lang=$("language").value;document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";});
$("save").onclick=()=>{const data={name:$("name").value,username:$("username").value,bio:$("bio").value,location:$("location").value,language:$("language").value,theme:$("theme").value,avatar,photo:photo.startsWith("data:")?photo:""};try{localStorage.setItem("noctryx_profile_v6",JSON.stringify(data));$("toast").textContent="Profile saved on this device.";$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2200)}catch(e){alert("Could not save. The uploaded image may be too large.")}};
$("reset").onclick=()=>{if(confirm("Reset profile?")){localStorage.removeItem("noctryx_profile_v6");location.reload()}};
try{const d=JSON.parse(localStorage.getItem("noctryx_profile_v6")||"null");if(d){["name","username","bio","location","language","theme"].forEach(k=>{if(d[k]!==undefined)$(k).value=d[k]});avatar=d.avatar||avatar;photo=d.photo||""}}catch(e){}
draw();render();
</script></body></html>
